<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d0f14" />
  <title>FXMIND — Dashboard</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dashboard.css" />
  <link rel="stylesheet" href="/design-system.css" />
  <link rel="stylesheet" href="/memory-graph.css" />
  <link rel="stylesheet" href="/workspace.css" />
  <script type="module" src="/dashboard.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="/" aria-label="FXMIND Dashboard"><img class="brand-logo" src="/logo.png" alt="" width="38" height="38" /><span>fxmind<span class="brand-dot">.</span><small>CONTROLE</small></span></a>
      <div class="project-scope">
        <div class="project-scope-heading"><span>PROJETO ATIVO</span>
          <button class="sidebar-refresh" id="refresh-button" type="button" title="Atualizar dados" aria-label="Atualizar dados"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.6"/><path d="M20 5v6h-6"/></svg></button>
        </div>
        <select id="project-select" aria-label="Buscar ou selecionar projeto"><option value="">Carregando…</option></select>
      </div>
      <div class="nav-caption">GERENCIAMENTO</div>
      <nav id="navigation" aria-label="Navegação principal">
        <button class="nav-item active" data-page="overview"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.3"/><rect x="14" y="3" width="7" height="7" rx="1.3"/><rect x="3" y="14" width="7" height="7" rx="1.3"/><rect x="14" y="14" width="7" height="7" rx="1.3"/></svg>Visão geral</button>
        <button class="nav-item" data-page="orchestration"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="9" width="5" height="5" rx="1.2"/><rect x="17" y="3" width="5" height="5" rx="1.2"/><rect x="17" y="16" width="5" height="5" rx="1.2"/><path d="M7 11.5h5v-6h5M12 11.5v7h5"/></svg>Orquestração</button>
        <button class="nav-item" data-page="agents"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2"/><path d="M17 8a3 3 0 0 1 0 6M18 16a5 5 0 0 1 3 4"/></svg>Agentes e modelos</button>
        <button class="nav-item" data-page="subagents"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="12" height="12" rx="2"/><path d="M8 20h10a2 2 0 0 0 2-2V8"/></svg>Subagentes</button>
        <button class="nav-item" data-page="providers"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M9 11l6-4M9 13l6 4"/></svg>Provedores</button>
        <button class="nav-item" data-page="projects"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 11h18"/></svg>Projetos e memória</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="connection"><span id="connection-dot" class="status-dot"></span><span id="connection-text">Conectando…</span></div>
        <div class="sidebar-version" id="sidebar-version">FXMIND</div>
        <span class="local-note">Painel local · Dados do seu ambiente</span>
      </div>
    </aside>
    <main class="main">
      <div class="mobile-toolbar"><button class="menu-toggle" id="menu-toggle" type="button" aria-label="Abrir navegação"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><span>FXMIND</span></div>
      <div class="content" id="content" aria-live="polite"><div class="loading">Carregando gerenciamento do FXMIND…</div></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>

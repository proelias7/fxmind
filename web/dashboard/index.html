<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d0f14" />
  <title>FXMIND — Dashboard</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/design-system.css" />
  <link rel="stylesheet" href="/dashboard.css" />
  <script type="module" src="/dashboard.js"></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/" aria-label="FXMIND"><img class="brand-logo" src="/logo.png" alt="" width="28" height="28" /><span>fxmind</span></a>
    <div class="bar-project"><select id="project-select" aria-label="Buscar ou selecionar projeto"><option value="">Carregando…</option></select></div>
    <nav id="navigation" aria-label="Navegação principal">
      <button type="button" data-page="memory" aria-current="page">Memórias</button>
      <button type="button" data-page="orchestration">Orquestração</button>
      <button type="button" data-page="settings">Configurações</button>
    </nav>
    <button class="icon-btn" id="refresh-button" type="button" title="Atualizar" aria-label="Atualizar dados"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.6"/><path d="M20 5v6h-6"/></svg></button>
    <span class="status-dot" id="connection-dot" role="img" aria-label="Conectando"></span>
  </header>
  <main id="content" aria-live="polite"><p class="state">Carregando…</p></main>
  <div class="savebar" id="savebar" hidden>
    <span>Alterações não salvas</span>
    <button class="btn" type="button" data-action="discard">Descartar</button>
    <button class="btn primary" type="button" data-action="save">Salvar</button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>

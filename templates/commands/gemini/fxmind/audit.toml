description = "Audit resource for security, performance, patterns — correction plan only"

prompt = """
**Read-only audit.** Do NOT edit code unless the user explicitly approves after reviewing the plan.

**Scope (optional):** {{args}}
If empty, use @ mention, open files, or ask which resource to audit.

## Load standards

Read `.fxmind/audits/procedure.md` (the installed pack audit procedure: passes, matrices, report structure) and only the skill references it names. Framework/UI skill from `.fxmind/skills/` when in scope.
Read `.fxmind/reference.md` at project root if present.

## Analyze

Read fxmanifest, server/client/shared Lua, NUI scripts in scope.
Grep: RegisterNetEvent, RegisterNUICallback, SafeEvent, SetCooldown, SendFullSync, SendDeltaSync, cacheaside, generateItem/addMoney, Wait(0), TriggerEvent, oxmysql.

Every finding MUST cite `file:line`. Severity: Critical / High / Medium / Low.

Check: SafeEvent on advantage events, SetCooldown on client spam, server validation, permissions, cerberus load balance for large sync, perf (Wait, callbacks in loops, cacheaside), clean code (§3.5–3.10), no thin event wrappers (§1.3).

## Output

Read `.fxmind/audits/README.md` if present.

Save report **only** to **`.fxmind/audits/<resource-name>.md`** (e.g. `garages` → `.fxmind/audits/garages.md`).

**Forbidden:** never create `.fxmind/audit-<name>.md` in the `.fxmind/` root.

Use audit.template.md structure + phased correction plan.

Judge findings against the installed pack principles under `.fxmind/policy/` and cite principle IDs.

Reply with executive summary, top 3 fixes, report path. Ask if user wants Phase 1 implemented (Task) — or, when problems span most of the resource, suggest `/fxmind:refactor <resource>`, which reuses this report. Wait for approval.

Do NOT recommend functions whose only body is TriggerEvent(...). Inline cross-resource events at call site.
"""
